name: TransferKit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transferkit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (Windows, locked dependencies)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14.4"

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock-win-py314.txt

      - name: Run Python unit suite
        run: python -m unittest discover -s tests -v

  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: |-
            platforms;android-34
            build-tools;34.0.0

      - name: Run Android unit tests and assemble debug APK
        working-directory: android-client
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
